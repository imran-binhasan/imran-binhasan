    </text>
    <!-- line 5 -->
    <text x="968" y="156" class="fm" font-size="12" fill="#2563eb" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="2.45s" dur="0.01s" fill="freeze"/>
